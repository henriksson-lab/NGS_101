  <rect x="300" y="630" width="210" height="84" rx="12" fill="#e4efef" stroke="#176c68" stroke-width="1.6" />
  <text x="405" y="664" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#172b3a" text-anchor="middle"><tspan x="405" dy="0">PCR</tspan><tspan x="405" dy="29">declared geometry</tspan></text>
  <rect x="560" y="620" width="250" height="102" rx="28" fill="#edf4f8" stroke="#bdcbd5" stroke-width="1.6" />
  <text x="685" y="649" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#172b3a" text-anchor="middle"><tspan x="685" dy="0">Mixture: daughters,</tspan><tspan x="685" dy="27">possible originals</tspan><tspan x="685" dy="27">and residuals</tspan></text>
  <rect x="855" y="630" width="225" height="84" rx="12" fill="#e4efef" stroke="#176c68" stroke-width="1.6" />
  <text x="967" y="664" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#172b3a" text-anchor="middle"><tspan x="967" dy="0">Physical cleanup</tspan><tspan x="967" dy="29">declared recovery</tspan></text>
  <rect x="1130" y="620" width="262" height="102" rx="28" fill="#edf4f8" stroke="#bdcbd5" stroke-width="1.6" />
  <text x="1261" y="662" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#172b3a" text-anchor="middle"><tspan x="1261" dy="0">Retained mixture</tspan><tspan x="1261" dy="29">sequencing plan</tspan></text>
  <rect x="855" y="784" width="225" height="82" rx="28" fill="#eff1f4" stroke="#bdcbd5" stroke-width="1.6" />
