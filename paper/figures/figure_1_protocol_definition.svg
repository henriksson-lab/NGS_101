  <text x="522" y="1023" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#516373" text-anchor="start"><tspan x="522" dy="0">Primer sites, read cycles and identifiers</tspan></text>
  <rect x="960" y="958" width="432" height="86" rx="12" fill="white" stroke="#bdcbd5" stroke-width="1.6" />
