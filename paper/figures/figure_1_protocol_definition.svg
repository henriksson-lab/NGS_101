  <text x="68" y="817" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#516373" text-anchor="start"><tspan x="68" dy="0">Illustrative topology; no experimental recipe is specified.</tspan><tspan x="68" dy="28">Independent polymers remain distinct within a mixture.</tspan></text>
  <text x="1130" y="804" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#516373" text-anchor="start"><tspan x="1130" dy="0">Rounded nodes: materials</tspan><tspan x="1130" dy="28">Rectangles: operations</tspan><tspan x="1130" dy="28">Arrows: input / output ports</tspan></text>
  <text x="48" y="931" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#285c88" text-anchor="start"><tspan x="48" dy="0">C</tspan></text>
