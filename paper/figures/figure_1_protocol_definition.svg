<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="180mm" height="135mm" viewBox="0 0 1440 1080" role="img" aria-labelledby="title description">
  <title id="title">Protocol-owned definitions form a typed provenance hypergraph</title>
  <desc id="description">A: source-qualified materials, steps, outcomes and evidence. B: an illustrative material-step graph with explicit reagent roles and a physical cleanup branch. C: views derived from the declarations.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#516373" />
    </marker>
  </defs>
  <rect x="0" y="0" width="1440" height="1080" fill="white" />
  <text x="48" y="53" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#172b3a" text-anchor="start"><tspan x="48" dy="0">Protocol definitions</tspan></text>
  <text x="48" y="88" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#516373" text-anchor="start"><tspan x="48" dy="0">Source-specific Python objects; shared computation and rendering</tspan></text>
  <text x="48" y="139" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#285c88" text-anchor="start"><tspan x="48" dy="0">A</tspan></text>
  <text x="87" y="139" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#172b3a" text-anchor="start"><tspan x="87" dy="0">What each protocol declares</tspan></text>
  <rect x="48" y="165" width="318" height="218" rx="12" fill="#edf4f8" stroke="#bdcbd5" stroke-width="1.6" />
  <text x="68" y="204" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#285c88" text-anchor="start"><tspan x="68" dy="0">Materials</tspan></text>
  <text x="68" y="249" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#172b3a" text-anchor="start"><tspan x="68" dy="0">Material kind and identity</tspan><tspan x="68" dy="32">Sequence or symbolic state</tspan><tspan x="68" dy="32">Features and modifications</tspan><tspan x="68" dy="32">Inference and provenance</tspan></text>
  <rect x="390" y="165" width="318" height="218" rx="12" fill="#edf4f8" stroke="#bdcbd5" stroke-width="1.6" />
  <text x="410" y="204" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#285c88" text-anchor="start"><tspan x="410" dy="0">Steps</tspan></text>
  <text x="410" y="249" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#172b3a" text-anchor="start"><tspan x="410" dy="0">Operation label (StepKind)</tspan><tspan x="410" dy="32">Inputs with explicit roles</tspan><tspan x="410" dy="32">Products and geometry</tspan><tspan x="410" dy="32">Optional molecular relations</tspan></text>
  <rect x="732" y="165" width="318" height="218" rx="12" fill="#edf4f8" stroke="#bdcbd5" stroke-width="1.6" />
  <text x="752" y="204" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#285c88" text-anchor="start"><tspan x="752" dy="0">Outcomes</tspan></text>
  <text x="752" y="249" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#172b3a" text-anchor="start"><tspan x="752" dy="0">Retained and residual classes</tspan><tspan x="752" dy="32">Physical discard, QC or gaps</tspan><tspan x="752" dy="32">Sequencing plan / limitation</tspan><tspan x="752" dy="32">Read and identifier layout</tspan></text>
  <rect x="1074" y="165" width="318" height="218" rx="12" fill="#edf4f8" stroke="#bdcbd5" stroke-width="1.6" />
  <text x="1094" y="204" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#285c88" text-anchor="start"><tspan x="1094" dy="0">Evidence</tspan></text>
  <text x="1094" y="249" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#172b3a" text-anchor="start"><tspan x="1094" dy="0">Defining source and revision</tspan><tspan x="1094" dy="32">Manual source inventory</tspan><tspan x="1094" dy="32">Review scope and exclusions</tspan><tspan x="1094" dy="32">Discrepancies and limitations</tspan></text>
  <text x="48" y="440" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#285c88" text-anchor="start"><tspan x="48" dy="0">B</tspan></text>
