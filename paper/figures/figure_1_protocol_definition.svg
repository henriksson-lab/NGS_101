  <rect x="545" y="491" width="250" height="82" rx="28" fill="#edf4f8" stroke="#bdcbd5" stroke-width="1.6" />
  <text x="670" y="524" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#172b3a" text-anchor="middle"><tspan x="670" dy="0">Catalyst + conditions</tspan><tspan x="670" dy="27">role-labelled inputs</tspan></text>
  <rect x="855" y="491" width="225" height="82" rx="28" fill="#edf4f8" stroke="#bdcbd5" stroke-width="1.6" />
