# Build the website with build_site.py and deploy it to GitHub Pages.
#
# Enable once the repository has a GitHub remote: Settings -> Pages -> Build and
# deployment -> Source: "GitHub Actions". Nothing generated is ever committed; the
# site is rebuilt from the sources on every push to main.
#
# The runner has only what is committed: no third-party papers, supplements or plasmid
# maps (_data/, pdf/, ref/ files listed in the MANIFESTs). Self-tests that need them
# SKIP, and diagram pages whose build script needs them are left out of the site.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push queues behind a running one rather than
# cancelling a deployment half-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Standard library only: nothing to pip install.
      - name: Protocol and catalogue self-tests
        run: |
          set -e
          for t in */tools/selftest.py */*/tools/selftest.py; do
            echo "::group::$t"
            python3 "$t"
            echo "::endgroup::"
          done

      - name: Build the site
        run: python3 build_site.py

      # Needs the rendered pages on disk (it lints every generated page), so after the build.
      - name: Renderer and docs self-test
        run: python3 tools/selftest.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
